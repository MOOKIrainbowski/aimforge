<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AimonSite">
  <!-- The mark is the hitmarker: the four-slash flash that pops the instant a
       shot lands, plus the impact point it brackets. It replaces a ring-plus-
       crosshair that had four centred shapes in the same family — tile, ring,
       dot, orthogonal ticks — which fused into a blue blob at 16px.

       Two things make this one survive being small: the strokes run diagonally,
       so the silhouette is a rotated X rather than the upright plus every other
       aim trainer uses, and the middle is left empty so the accent dot has
       somewhere to sit.

       Theme handling is inside the SVG. There is no background tile: the ink
       follows the browser's own colour scheme through prefers-color-scheme, so
       the mark sits on a light tab bar and a dark one without carrying a patch
       of the wrong colour with it. The accent stays put across both — it is
       legible on either, and it is what makes the icon findable in a row of
       tabs. -->
  <style>
    .ink { stroke: #1b1e26; }
    .hit { fill: #4f8ef7; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f2f4f8; }
      .hit { fill: #6ea6ff; }
    }
  </style>

  <g class="ink" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M5.5 5.5 L10.8 10.8" />
    <path d="M26.5 5.5 L21.2 10.8" />
    <path d="M5.5 26.5 L10.8 21.2" />
    <path d="M26.5 26.5 L21.2 21.2" />
  </g>
  <circle class="hit" cx="16" cy="16" r="4.1" />
</svg>
